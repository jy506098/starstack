<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP 支付 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('vip')}"></nav>

    <main class="container">
        <h1>💳 微信支付（模拟）</h1>
        <div class="pay-card">
            <p>套餐: <strong th:text="${pkgLabel}">VIP</strong></p>
            <p>金额: <strong>¥<span th:text="${order.priceCny}">0</span></strong></p>
            <p>订单号: <code th:text="${order.orderId}">orderId</code></p>
            <p class="muted">点击下方按钮模拟支付成功</p>
            <a class="btn btn-vip btn-block"
               th:href="@{/vip_pay_confirm/{id}(id=${order.orderId})}">确认支付（模拟）</a>
            <p style="margin-top:1rem;">
                <a href="/vip" class="btn btn-secondary">取消</a>
            </p>
        </div>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
