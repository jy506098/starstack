<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>降噪耳机 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/music.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('inventory')}"></nav>
    <main class="container">
        <h1>🎧 降噪耳机（白噪音）</h1>
        <p class="muted">点击下方开始播放，专注模式 + 白噪音助你心流</p>

        <div class="music-player">
            <div class="track-info">
                <h2 id="track-title">雨声</h2>
                <p id="track-status" class="muted">点击 ▶ 播放</p>
            </div>
            <audio id="audio-player" loop></audio>
            <div class="player-controls">
                <button id="play-btn" class="btn btn-primary">▶ 播放</button>
                <select id="track-select">
                    <option value="rain">🌧️ 雨声</option>
                    <option value="forest">🌲 森林</option>
                    <option value="ocean">🌊 海浪</option>
                    <option value="fire">🔥 壁炉</option>
                    <option value="cafe">☕ 咖啡馆</option>
                </select>
            </div>
        </div>
    </main>

    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
    <script type="module" src="/js/pages/music.js"></script>
</body>
</html>
