<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>前端三剑客 入门 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('inventory')}"></nav>
    <main class="container">
        <h1>🌐 前端三剑客 入门</h1>
        <p class="muted">HTML + CSS + JavaScript</p>
        <article class="content-body">
            <h2>1. HTML 结构</h2>
            <pre><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;&lt;head&gt;&lt;title&gt;Hello&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;&lt;h1&gt;Hi&lt;/h1&gt;&lt;/body&gt;&lt;/html&gt;</code></pre>
            <h2>2. CSS 样式</h2>
            <pre><code>h1 { color: hotpink; font-size: 2rem; }</code></pre>
            <h2>3. JavaScript 行为</h2>
            <pre><code>document.querySelector('h1').onclick = () => alert('Hi!');</code></pre>
        </article>
    </main>
    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
