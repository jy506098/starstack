<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏中心 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('game_center')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <h1>🎮 游戏中心</h1>
        <p class="muted">当前积分: <strong>💰 <span th:text="${ctx.userPoints}">0</span></strong></p>

        <div class="item-grid">
            <div class="item-card"
                 th:each="game : ${games}"
                 th:classappend="${#lists.contains(ctx.unlockedContent, game)} ? 'unlocked' : ''">
                <h3 th:text="${game}">game</h3>
                <div class="item-footer">
                    <span class="item-price">
                        💰 <span th:text="${prices[game].price}">0</span>
                    </span>
                    <a class="btn btn-primary"
                       th:if="${#lists.contains(ctx.unlockedContent, game)}"
                       th:href="@{/play_game/{name}(name=${game})}">开始游戏</a>
                    <form th:unless="${#lists.contains(ctx.unlockedContent, game)}"
                          method="post" action="/buy_game" style="display:inline;">
                        <input type="hidden" name="game" th:value="${game}">
                        <button class="btn btn-primary" type="submit">购买</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
    <script type="module" src="/js/pages/game_center.js"></script>
</body>
</html>
