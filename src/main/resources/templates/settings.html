<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('settings')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <h1>⚙️ 设置</h1>

        <section class="settings-section">
            <h2>👤 头像</h2>
            <form method="post" action="/settings/avatar" enctype="multipart/form-data" class="avatar-form">
                <img class="avatar-preview"
                     th:src="${#strings.isEmpty(ctx.avatar) or #strings.startsWith(ctx.avatar, 'default:')
                              ? '/avatars/default.svg' : ctx.avatar}"
                     alt="avatar">
                <input type="file" name="file" accept="image/*" required>
                <button class="btn btn-primary" type="submit">上传头像</button>
            </form>
        </section>

        <section class="settings-section">
            <h2>🖱️ 鼠标拖尾效果</h2>
            <div id="mouse-config-form">
                <label>
                    <input type="checkbox" id="mouse-enabled"
                           th:checked="${ctx.mouseConfig.enabled}">
                    启用鼠标拖尾
                </label>
                <label>
                    颜色：
                    <select id="mouse-color-mode">
                        <option value="rainbow">彩虹</option>
                        <option value="cyan">青色</option>
                        <option value="random">随机</option>
                    </select>
                </label>
                <label>
                    形状：
                    <select id="mouse-shape">
                        <option value="circle">圆形</option>
                        <option value="square">方形</option>
                        <option value="star">星形</option>
                    </select>
                </label>
                <button class="btn btn-primary" type="button" id="save-mouse-config">保存</button>
            </div>
        </section>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
    <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
