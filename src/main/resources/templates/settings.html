<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('settings')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <h1>⚙️ 设置</h1>

        <section class="settings-section">
            <h2>👤 头像</h2>
            <form method="post" action="/settings/avatar" enctype="multipart/form-data" class="avatar-form">
                <img class="avatar-preview"
                     th:src="${#strings.isEmpty(ctx.avatar) or #strings.startsWith(ctx.avatar, 'default:')
                              ? '/avatars/default.svg' : ctx.avatar}"
                     alt="avatar">
                <input type="file" name="file" accept="image/*" required>
                <button class="btn btn-primary" type="submit">上传头像</button>
            </form>
            <form method="post" action="/settings/avatar" style="margin-top:.5rem;">
                <input type="hidden" name="action" value="reset">
                <button class="btn btn-ghost" type="submit">恢复默认头像</button>
            </form>
        </section>

        <section class="settings-section" th:if="${ctx.isVip}">
            <h2>👑 VIP 状态</h2>
            <p>当前等级：<strong th:text="${ctx.vipTier}">VIP</strong></p>
            <p>剩余天数：<strong th:text="${ctx.vipDaysLeft}">0</strong> 天</p>
            <p>到期时间：<strong th:text="${ctx.vipExpiresAtStr}">--</strong></p>
            <a class="btn btn-primary" href="/vip">续费 / 升级</a>
        </section>

        <section class="settings-section" th:unless="${ctx.isVip}">
            <h2>👑 开通 VIP</h2>
            <p>开通 VIP 享受每日积分加成 + 专属服务器 + 教程白名单。</p>
            <a class="btn btn-primary" href="/vip">查看 VIP 套餐</a>
        </section>

        <section class="settings-section" th:if="${ctx.isVip}">
            <h2>🎮 MC 服务器（VIP 特权）</h2>
            <p>地址：<code th:text="${MC_SERVER_CONFIG.host}">--</code>:<code th:text="${MC_SERVER_CONFIG.port}">--</code></p>
            <p>版本：<code th:text="${MC_SERVER_CONFIG.version}">--</code></p>
            <p>MOTD：<code th:text="${MC_SERVER_CONFIG.motd}">--</code></p>
        </section>

        <section class="settings-section">
            <h2>🔐 修改密码</h2>
            <form method="post" action="/settings" class="form">
                <label>原密码<input type="password" name="old_password" required minlength="8" maxlength="16"></label>
                <label>新密码<input type="password" name="new_password" required minlength="8" maxlength="16"></label>
                <label>确认新密码<input type="password" name="confirm_password" required minlength="8" maxlength="16"></label>
                <button class="btn btn-primary" type="submit">更新密码</button>
            </form>
        </section>

        <section class="settings-section">
            <h2>📱 手机号</h2>
            <form method="post" action="/settings" class="form">
                <label>手机号（11 位，1 开头）
                    <input type="tel" name="phone" th:value="${ctx.phone}"
                           pattern="^1[3-9]\d{9}$" placeholder="13800138000">
                </label>
                <button class="btn btn-primary" type="submit">保存手机号</button>
            </form>
        </section>

        <section class="settings-section">
            <h2>🖱️ 鼠标拖尾效果</h2>
            <div id="mouse-config-form">
                <label>
                    <input type="checkbox" id="mouse-enabled"
                           th:checked="${ctx.mouseConfig.enabled}">
                    启用鼠标拖尾
                </label>
                <label>
                    颜色：
                    <select id="mouse-color-mode">
                        <option value="rainbow">彩虹</option>
                        <option value="cyan">青色</option>
                        <option value="random">随机</option>
                    </select>
                </label>
                <label>
                    形状：
                    <select id="mouse-shape">
                        <option value="circle">圆形</option>
                        <option value="square">方形</option>
                        <option value="star">星形</option>
                    </select>
                </label>
                <button class="btn btn-primary" type="button" id="save-mouse-config">保存</button>
            </div>
        </section>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
    <script type="module" src="/js/pages/settings.js"></script>
</body>
</html>
