<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Python 后端入门 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('inventory')}"></nav>
    <main class="container">
        <h1>🛠️ Python 后端入门</h1>
        <p class="muted">Flask / Django / FastAPI</p>
        <article class="content-body">
            <h2>1. Flask 最小应用</h2>
            <pre><code>from flask import Flask
app = Flask(__name__)

@app.route('/')
def hello():
    return 'Hi'</code></pre>
            <h2>2. 数据库</h2>
            <p>SQLAlchemy — ORM；迁移用 Alembic。</p>
            <h2>3. 部署</h2>
            <p>gunicorn / uvicorn / docker / k8s — 选你舒服的。</p>
        </article>
    </main>
    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
