<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarStack - 首页</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('board')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <section class="hero">
            <h1>欢迎来到星栈</h1>
            <p>StarStack一切从这里开始 ✨</p>
            <p style="margin-top:1rem;" th:unless="${ctx.username != null}">
                <a class="btn btn-primary" href="/login">登录</a>
                <a class="btn btn-vip" href="/register">注册新账号</a>
            </p>
        </section>

        <section class="settings-section">
            <h2>🚀 快速开始</h2>
            <ul class="vip-perks" style="font-size:1rem;">
                <li>💬 <a href="/message_board">留言板</a> — 发表想法，浏览其他用户的留言</li>
                <li>🛒 <a href="/store">商店</a> — 用积分兑换教程、游戏、影视中心、VIP 会员</li>
                <li>🎒 <a href="/inventory">背包</a> — 查看已购商品和使用效果</li>
                <li>📋 <a href="/tasks">任务</a> — 完成每日 / 固定任务赚积分</li>
                <li>👑 <a href="/vip">VIP 会员</a> — 解锁全部教程 + 影视音乐 + 9 折优惠</li>
            </ul>
        </section>

        <section class="settings-section" th:if="${ctx.username != null}">
            <h2>💬 最新留言</h2>
            <div class="message-list">
                <div th:each="m : ${messages}" class="message-item">
                    <div class="message-meta">
                        <strong th:text="${m.name}">name</strong>
                        <span class="muted" th:text="${m.createdAt}">date</span>
                    </div>
                    <p th:text="${m.msg}">content</p>
                </div>
                <p th:if="${#lists.isEmpty(messages)}" class="muted">还没有留言，来抢沙发？</p>
            </div>
            <form method="post" action="/post" class="post-form" style="margin-top:1rem;">
                <textarea name="msg" required placeholder="说点什么..." rows="3"></textarea>
                <button class="btn btn-primary" type="submit">发布</button>
            </form>
        </section>
    </main>

    <div class="meteor-shower" aria-hidden="true">
        <i class="meteor"></i><i class="meteor"></i><i class="meteor"></i><i class="meteor"></i>
        <i class="meteor"></i><i class="meteor"></i><i class="meteor"></i><i class="meteor"></i>
    </div>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>

    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
