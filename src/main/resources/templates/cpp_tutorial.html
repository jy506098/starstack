<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>C++ 入门 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('inventory')}"></nav>
    <main class="container">
        <h1>⚡ C++ 入门</h1>
        <p class="muted">从 Hello World 到模板元编程</p>
        <article class="content-body">
            <h2>1. 第一个程序</h2>
            <pre><code>#include &lt;iostream&gt;
int main() {
    std::cout &lt;&lt; "Hello, World!" &lt;&lt; std::endl;
    return 0;
}</code></pre>
            <h2>2. 编译</h2>
            <pre><code>g++ -std=c++17 -O2 hello.cpp -o hello
./hello</code></pre>
            <h2>3. STL 容器</h2>
            <p>vector / map / unordered_map / set / queue / stack — 90% 的日常需求都靠它们。</p>
        </article>
    </main>
    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
