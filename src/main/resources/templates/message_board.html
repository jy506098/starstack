<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('message_board')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <section class="content">
            <h1>💬 留言板</h1>

            <form method="post" action="/post" class="post-form">
                <textarea name="msg" required placeholder="说点什么..." rows="3"></textarea>
                <button class="btn btn-primary" type="submit">发布</button>
            </form>

            <div class="message-list">
                <div th:each="m : ${messages}" class="message-item">
                    <div class="message-meta">
                        <strong th:text="${m.name}">name</strong>
                        <span class="muted" th:text="${m.createdAt}">date</span>
                    </div>
                    <p th:text="${m.msg}">content</p>
                    <form method="get" th:action="@{/delete/{id}(id=${m.id})}" style="margin-top:.5rem;">
                        <button class="btn btn-secondary" type="submit"
                                th:if="${ctx.username == m.name or (ctx.username != null and ctx.username == 'admin') or (ctx.username != null and m.name.startsWith(ctx.username))}">删除</button>
                    </form>
                </div>
                <p th:if="${#lists.isEmpty(messages)}" class="muted">还没有留言。</p>
            </div>
        </section>
    </main>

    <div class="meteor-shower" aria-hidden="true">
        <i class="meteor"></i><i class="meteor"></i><i class="meteor"></i><i class="meteor"></i>
        <i class="meteor"></i><i class="meteor"></i><i class="meteor"></i><i class="meteor"></i>
    </div>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>

    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
