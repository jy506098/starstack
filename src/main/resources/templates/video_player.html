<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>影视中心 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('video_player')}"></nav>
    <main class="container">
        <h1>🎬 影视中心</h1>
        <p class="muted">VIP 专属 · 多线路 · 全剧集</p>

        <div class="video-player">
            <video id="video" controls width="100%">
                <source th:src="${movieUrl}" type="video/mp4">
                您的浏览器不支持 video 标签。
            </video>
        </div>

        <p class="muted">提示：可在此挂载第三方视频源 / 自定义剧集列表。</p>
    </main>

    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
