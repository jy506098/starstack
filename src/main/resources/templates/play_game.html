<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${gameName} + ' - StarStack'">游戏 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/games.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('game_center')}"></nav>

    <main class="container game-stage">
        <h1 th:text="${gameName}">game</h1>
        <div id="game-container">
            <canvas id="game-canvas"></canvas>
            <div id="game-status" class="muted"></div>
        </div>
        <p><a href="/game_center" class="btn btn-secondary">← 返回游戏中心</a></p>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
    <th:block th:if="${gameName == '贪吃蛇大作战'}">
        <script type="module" src="/js/pages/snake.js"></script>
    </th:block>
    <th:block th:unless="${gameName == '贪吃蛇大作战'}">
        <script th:src="@{'/js/games/' + ${gameJsFile}}" defer></script>
        <script defer src="/js/games/dispatcher.js"></script>
        <script>
            window.addEventListener('load', () => {
                const canvas = document.getElementById('game-canvas');
                const status = document.getElementById('game-status');
                if (canvas && status && window.Games && window.Games['__dispatcher__']) {
                    window.Games['__dispatcher__'](canvas, status, '/*[[${gameName}]]*/');
                }
            });
        </script>
    </th:block>
</body>
</html>
