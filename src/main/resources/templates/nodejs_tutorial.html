<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Node.js 入门 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('inventory')}"></nav>
    <main class="container">
        <h1>🟢 Node.js 入门</h1>
        <p class="muted">服务端 JavaScript</p>
        <article class="content-body">
            <h2>1. 安装</h2>
            <p>从 nodejs.org 下载 LTS 版本；验证：<code>node -v</code>。</p>
            <h2>2. 第一个 HTTP 服务</h2>
            <pre><code>const http = require('http');
http.createServer((req, res) =&gt; {
  res.end('Hello');
}).listen(3000);</code></pre>
            <h2>3. Express 框架</h2>
            <p>npm install express — 5 行代码搭出 REST API。</p>
        </article>
    </main>
    <canvas id="mouseTrailCanvas" th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
