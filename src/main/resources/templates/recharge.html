<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>充值 - StarStack</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body th:classappend="${ctx.hasCyberTshirt} ? 'cyber-tshirt' : ''">
    <nav class="navbar" th:replace="~{fragments/navbar :: navbar('recharge')}"></nav>

    <main class="container">
        <div th:if="${success}" class="flash success" th:text="${success}"></div>
        <div th:if="${error}" class="flash error" th:text="${error}"></div>

        <h1>💰 积分充值</h1>
        <p class="muted">当前积分: <strong>💰 <span th:text="${ctx.userPoints}">0</span></strong></p>

        <div class="item-grid">
            <div class="item-card" th:each="entry : ${packages}">
                <h3 th:text="${entry.value.label}">pkg</h3>
                <p class="item-desc">
                    充值 ¥<span th:text="${entry.value.price_cny}"></span>，
                    获得 <strong><span th:text="${entry.value.points}"></span></strong> 积分
                    <span th:if="${entry.value.bonus_points > 0}">
                        + 赠送 <strong><span th:text="${entry.value.bonus_points}"></span></strong>
                    </span>
                </p>
                <div class="item-footer">
                    <span class="item-price">¥<span th:text="${entry.value.price_cny}"></span></span>
                    <form method="post" action="/buy_recharge" style="display:inline;">
                        <input type="hidden" name="pkg" th:value="${entry.key}">
                        <button class="btn btn-vip" type="submit">立即充值</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <canvas id="mouseTrailCanvas"
            th:class="${ctx.mouseEffectEnabled} ? 'mouse-trail-canvas' : 'mouse-trail-canvas hidden'"></canvas>
    <script type="module" src="/js/pages/main.js"></script>
</body>
</html>
